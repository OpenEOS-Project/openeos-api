        includeTestOrders:
          type: boolean
          default: false
          description: "„Testbestellungen mitsenden“ (Testmodus und Phase „Geplant“); sie tragen dann `isTest: true`."
      required:
        - url
        - eventTypes
    UpdateWebhookDto:
      type: object
      properties:
        url:
          type: string
          maxLength: 2048
        description:
          type: object
          maxLength: 255
          nullable: true
        eventTypes:
          type: array
          items:
            type: string
            enum: *a132
        active:

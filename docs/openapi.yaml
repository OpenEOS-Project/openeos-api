openapi: 3.0.0
paths:
  /api/public/changelog:
    get:
      description: Entries are plain-language and bilingual. `since` returns only what is newer than that date — the signed-in app uses it to show a user what arrived since their last visit. `latestVersion` is the release number the website shows in its badge.
      operationId: changelog_list
      parameters:
        - name: since
          required: false
          in: query
          description: JJJJ-MM-TT
          schema:
            type: string
      responses:
        "200":
          description: ""
      summary: What changed, newest first
      tags:
        - Changelog
  /api/admin/api-tokens:
    get:
      operationId: apiTokens_liste
      parameters: []
      responses:
        "200":
          description: ""
      security: &a1
        - JWT-auth: []
      summary: List your API tokens (never the secrets)
      tags: &a2
        - Admin
    post:
      description: The secret is returned exactly once, here. It is stored only as a hash, so a lost token cannot be recovered — issue a new one.
      operationId: apiTokens_erstelle
      parameters: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreateApiTokenDto"
      responses:
        "201":
          description: ""
      security: *a1
      summary: Issue an API token
      tags: *a2
  /api/admin/api-tokens/{id}:
    delete:
      operationId: apiTokens_widerrufe
      parameters:
        - name: id
          required: true
          in: path
          schema:
            type: string
      responses:
        "200":
          description: ""
      security: *a1
      summary: Revoke a token
      tags: *a2
  /api/organizations/{organizationId}/api-tokens:
    get:
      description: Alle Tokens der Organisation, auch widerrufene und abgelaufene, neueste zuerst. Vom Geheimnis bleibt nur `tokenPrefix` sichtbar. Nur mit Anmeldung (JWT) als Administrator — nicht per Token.
      operationId: listApiTokens
      parameters:
        - name: organizationId
          required: true
          in: path
          description: ID der Organisation
          schema:
            format: uuid
            type: string
      responses:
        "200":
          description: ""
      security: &a3
        - JWT-auth: []
      summary: API-Zugänge auflisten
      tags: &a4
        - API Tokens
    post:
      description: Stellt einen Token mit Name, Scopes und optionalem Ablauf aus. Das Geheimnis (`data.token`, `oeos_…`) kommt genau einmal in dieser Antwort; gespeichert wird nur ein Hash. Höchstens 20 aktive Tokens je Organisation (`409 API_TOKEN_LIMIT_REACHED`). Nur mit Anmeldung als Administrator.
      operationId: createApiToken
      parameters:
        - name: organizationId
          required: true
          in: path
          description: ID der Organisation
          schema:
            format: uuid
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreateOrganizationApiTokenDto"
      responses:
        "201":
          description: Token issued; `data.token` holds the secret
        "409":
          description: API_TOKEN_LIMIT_REACHED
      security: *a3
      summary: API-Zugang anlegen
      tags: *a4
  /api/organizations/{organizationId}/api-tokens/{id}:
    delete:
      description: Widerruft einen Token sofort; der Eintrag bleibt mit `revokedAt` in der Liste. Jeder Administrator der Organisation darf jeden Token der Organisation widerrufen. Nur mit Anmeldung.
      operationId: revokeApiToken
      parameters:
        - name: organizationId
          required: true
          in: path
          description: ID der Organisation
          schema:
            format: uuid
            type: string
        - name: id
          required: true
          in: path
          description: ID des Tokens
          schema:
            format: uuid
            type: string
      responses:
        "200":
          description: ""
      security: *a3
      summary: API-Zugang widerrufen
      tags: *a4
  /api/monitoring/metrics:
    get:
      description: "Counters plus short lists of the newest events, each carrying an id so a monitor can tell what it has already reported. Deliberately sparse on people: surnames as an initial, no email addresses, message previews cut at 80 characters. Shaped to stay stable, unlike the admin lists, which follow the UI."
      operationId: monitoring_metrics
      parameters: []
      responses:
        "200":
          description: ""
      security:
        - JWT-auth: []
        - API-token: []
      summary: Platform counters for monitoring
      tags:
        - Monitoring
      x-api-token-scope: monitoring:read
  /api/auth/register:
    post:
      description: Creates an account. Without a password the account is used via login links, and one is sent straight away.
      operationId: auth_register
      parameters: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/RegisterDto"
      responses:
        "201":
          description: Registered; mail sent
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/RegisterResponseDto"
        "400":
          description: Invalid input data
        "409":
          description: Email already exists
      summary: Register a new user
      tags: &a5
        - Auth
  /api/auth/verify-email:
    post:
      description: Verify a user's email using the token from the verification email
      operationId: auth_verifyEmail
      parameters: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/VerifyEmailDto"
      responses:
        "200":
          description: Email verified successfully
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/MessageResponseDto"
        "400":
          description: Invalid or expired token
      summary: Verify email address
      tags: *a5
  /api/auth/resend-verification:
    post:
      description: Resend the email verification link if the account exists and is unverified
      operationId: auth_resendVerification
      parameters: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ResendVerificationDto"
      responses:
        "200":
          description: Verification email sent if applicable
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/MessageResponseDto"
      summary: Resend verification email
      tags: *a5
  /api/auth/login:
    post:
      description: Authenticate user with email and password
      operationId: auth_login
      parameters: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/LoginDto"
      responses:
        "200":
          description: Login successful
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/LoginResponseDto"
        "401":
          description: Invalid credentials
        "423":
          description: Account locked
      summary: Login user
      tags: *a5
  /api/auth/refresh:
    post:
      description: Get a new access token using refresh token
      operationId: auth_refresh
      parameters: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/RefreshTokenDto"
      responses:
        "200":
          description: New access token generated
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/RefreshResponseDto"
        "401":
          description: Invalid or expired refresh token
      summary: Refresh access token
      tags: *a5
  /api/auth/logout:
    post:
      description: Invalidate refresh token and clear cookie
      operationId: auth_logout
      parameters: []
      responses:
        "200":
          description: Logout successful
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/MessageResponseDto"
        "401":
          description: Unauthorized
      security:
        - JWT-auth: []
      summary: Logout user
      tags: *a5
  /api/auth/forgot-password:
    post:
      description: Send password reset email if account exists
      operationId: auth_forgotPassword
      parameters: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ForgotPasswordDto"
      responses:
        "200":
          description: Reset email sent if account exists
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/MessageResponseDto"
      summary: Request password reset
      tags: *a5
  /api/auth/magic-link/request:
    post:
      description: Sends a one-time login link if the account exists. Always returns 200.
      operationId: auth_requestMagicLink
      parameters: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/RequestMagicLinkDto"
      responses:
        "200":
          description: Link sent if account exists
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/MessageResponseDto"
      summary: Request a login link
      tags: *a5
  /api/auth/magic-link/verify:
    post:
      description: Exchanges a one-time login token for a session.
      operationId: auth_verifyMagicLink
      parameters: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/VerifyMagicLinkDto"
      responses:
        "200":
          description: Login successful
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/LoginResponseDto"
        "401":
          description: Invalid or expired link
      summary: Redeem a login link
      tags: *a5
  /api/auth/reset-password:
    post:
      description: Reset password using token from email
      operationId: auth_resetPassword
      parameters: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ResetPasswordDto"
      responses:
        "200":
          description: Password reset successful
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/MessageResponseDto"
        "400":
          description: Invalid or expired token
      summary: Reset password
      tags: *a5
  /api/auth/change-password:
    patch:
      description: Change password for authenticated user
      operationId: auth_changePassword
      parameters: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ChangePasswordDto"
      responses:
        "200":
          description: Password changed successfully
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/MessageResponseDto"
        "400":
          description: Invalid current password
        "401":
          description: Unauthorized
      security:
        - JWT-auth: []
      summary: Change password
      tags: *a5
  /api/auth/me:
    get:
      description: Get profile of authenticated user
      operationId: auth_getCurrentUser
      parameters: []
      responses:
        "200":
          description: User profile
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CurrentUserResponseDto"
        "401":
          description: Unauthorized
      security:
        - JWT-auth: []
      summary: Get current user
      tags: *a5
  /api/auth/me/invitations:
    get:
      description: Get all pending organization invitations for the current user
      operationId: auth_getPendingInvitations
      parameters: []
      responses:
        "200":
          description: List of pending invitations
        "401":
          description: Unauthorized
      security:
        - JWT-auth: []
      summary: Get pending invitations
      tags: *a5
  /api/auth/2fa/status:
    get:
      description: Get the current 2FA status for the user
      operationId: auth_get2FAStatus
      parameters: []
      responses:
        "200":
          description: 2FA status
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/TwoFactorStatusResponseDto"
        "401":
          description: Unauthorized
      security:
        - JWT-auth: []
      summary: Get 2FA status
      tags: *a5
  /api/auth/2fa/setup/totp:
    post:
      description: Generate QR code and secret for TOTP authentication
      operationId: auth_setupTotp
      parameters: []
      responses:
        "201":
          description: TOTP setup data
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/TotpSetupResponseDto"
        "400":
          description: 2FA already enabled
        "401":
          description: Unauthorized
      security:
        - JWT-auth: []
      summary: Start TOTP setup
      tags: *a5
  /api/auth/2fa/setup/totp/verify:
    post:
      description: Verify TOTP code and enable 2FA
      operationId: auth_verifyTotpSetup
      parameters: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/VerifyTotpSetupDto"
      responses:
        "200":
          description: Recovery codes
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/RecoveryCodesResponseDto"
        "400":
          description: Invalid code or 2FA already enabled
        "401":
          description: Unauthorized
      security:
        - JWT-auth: []
      summary: Verify TOTP setup
      tags: *a5
  /api/auth/2fa/setup/email:
    post:
      description: Send verification code to email for 2FA setup
      operationId: auth_setupEmailOtp
      parameters: []
      responses:
        "201":
          description: OTP sent
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/MessageResponseDto"
        "400":
          description: 2FA already enabled
        "401":
          description: Unauthorized
      security:
        - JWT-auth: []
      summary: Start Email OTP setup
      tags: *a5
  /api/auth/2fa/setup/email/verify:
    post:
      description: Verify email code and enable 2FA
      operationId: auth_verifyEmailOtpSetup
      parameters: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/VerifyEmailOtpSetupDto"
      responses:
        "200":
          description: Recovery codes
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/RecoveryCodesResponseDto"
        "400":
          description: Invalid code or 2FA already enabled
        "401":
          description: Unauthorized
      security:
        - JWT-auth: []
      summary: Verify Email OTP setup
      tags: *a5
  /api/auth/2fa/verify:
    post:
      description: "Second login step: exchanges the pending token for a session."
      operationId: auth_verify2FA
      parameters: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/Verify2FADto"
      responses:
        "200":
          description: Login complete
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/LoginResponseDto"
        "401":
          description: Invalid code
      security:
        - JWT-auth: []
      summary: Verify 2FA code
      tags: *a5
  /api/auth/2fa/disable:
    post:
      description: Disable 2FA for the user
      operationId: auth_disable2FA
      parameters: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/Disable2FADto"
      responses:
        "200":
          description: 2FA disabled
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/MessageResponseDto"
        "400":
          description: 2FA not enabled
        "401":
          description: Unauthorized or invalid second-factor code
      security:
        - JWT-auth: []
      summary: Disable 2FA
      tags: *a5
  /api/auth/2fa/recovery/generate:
    post:
      description: Generate new recovery codes (invalidates old ones)
      operationId: auth_regenerateRecoveryCodes
      parameters: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/RegenerateRecoveryCodesDto"
      responses:
        "201":
          description: New recovery codes
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/RecoveryCodesResponseDto"
        "400":
          description: 2FA not enabled
        "401":
          description: Unauthorized or invalid second-factor code
      security:
        - JWT-auth: []
      summary: Generate new recovery codes
      tags: *a5
  /api/auth/2fa/trusted-devices:
    get:
      description: Get list of trusted devices for 2FA
      operationId: auth_getTrustedDevices
      parameters: []
      responses:
        "200":
          description: List of trusted devices
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/TrustedDeviceResponseDto"
        "401":
          description: Unauthorized
      security:
        - JWT-auth: []
      summary: Get trusted devices
      tags: *a5
  /api/auth/2fa/trusted-devices/{id}:
    delete:
      description: Remove a trusted device
      operationId: auth_removeTrustedDevice
      parameters:
        - name: id
          required: true
          in: path
          schema:
            type: string
      responses:
        "200":
          description: Device removed
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/MessageResponseDto"
        "400":
          description: Device not found
        "401":
          description: Unauthorized
      security:
        - JWT-auth: []
      summary: Remove trusted device
      tags: *a5
  /api/auth/2fa/send-login-otp:
    post:
      description: Send OTP code to email for 2FA login
      operationId: auth_sendLoginOtp
      parameters: []
      responses:
        "200":
          description: OTP sent
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/MessageResponseDto"
        "400":
          description: Email 2FA not enabled
        "401":
          description: Unauthorized
      security:
        - JWT-auth: []
      summary: Send login OTP
      tags: *a5
  /api/organizations/{id}/tse:
    get:
      description: "Zustand der Cloud-TSE: Verfügbarkeit auf diesem Server (`available`; feiner `availability`: `available`, `coming_soon` = gehostet und angekündigt über `TSE_COMING_SOON`, `not_configured`), Integration, Voraussetzungen (`eligibility`: bezahlte Veranstaltung, Monat), TSE (`unit`), Live-Status von Swissbit (Speicher, Signaturen im Monat, Produkt, Zertifikat; 60 s zwischengespeichert), offener Ausfall, Zähler der letzten 30 Tage, Exporte und Verlauf aller TSEs."
      operationId: tse_getStatus
      parameters:
        - name: id
          required: true
          in: path
          description: ID der Organisation
          schema:
            format: uuid
            type: string
      responses:
        "200":
          description: ""
      security: &a6
        - JWT-auth: []
      summary: Cloud-TSE status (admins)
      tags: &a7
        - Cloud-TSE
    post:
      description: "Legt die Cloud-TSE an (nur Deutschland, Integration `tse` eingeschaltet, bezahlte Veranstaltung, frühestens im Monat ihres Beginns). Idempotent: eine laufende TSE kommt zurück. Die Anlage läuft im Hintergrund weiter (`state`: `creating` → `active`). Fehler: 503 TSE_NOT_AVAILABLE, 400 TSE_COUNTRY_NOT_SUPPORTED, 403 INTEGRATION_DISABLED, 409 TSE_REQUIRES_PAID_EVENT, 409 TSE_TOO_EARLY (`params.availableFrom`). Super-Admins können mit `override` + `reason` übersteuern."
      operationId: tse_create
      parameters:
        - name: id
          required: true
          in: path
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreateTseDto"
      responses:
        "202":
          description: ""
      security: *a6
      summary: Create the Cloud-TSE (admins, asynchronous)
      tags: *a7
  /api/organizations/{id}/tse/deactivate:
    post:
      description: "Nimmt die TSE endgültig außer Betrieb (Swissbit `disableSecureElement`). Braucht `confirm: true` (sonst 400 TSE_DEACTIVATION_CONFIRM_REQUIRED). Der abschließende Export wird automatisch abgeholt; die Integration wird ausgeschaltet. Danach ist Bargeld in Deutschland gesperrt."
      operationId: tse_deactivate
      parameters:
        - name: id
          required: true
          in: path
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/DeactivateTseDto"
      responses:
        "200":
          description: ""
      security: *a6
      summary: Deactivate the Cloud-TSE permanently (admins, confirm required)
      tags: *a7
  /api/organizations/{id}/tse/exports:
    get:
      description: "TAR-Exporte (TR-03153) im Archiv von OpenEOS: Zeitraum, Größe, SHA-256, Status (`pending`, `downloaded`, `failed`), Auslöser."
      operationId: tse_listExports
      parameters:
        - name: id
          required: true
          in: path
          schema:
            type: string
      responses:
        "200":
          description: ""
      security: *a6
      summary: List TSE exports (admins)
      tags: *a7
    post:
      description: Startet einen Export der aktiven TSE im Hintergrund und holt ihn ab. Die Liste zeigt den Fortschritt.
      operationId: tse_requestExport
      parameters:
        - name: id
          required: true
          in: path
          schema:
            type: string
      responses:
        "202":
          description: ""
      security: *a6
      summary: Export now (admins)
      tags: *a7
  /api/organizations/{id}/tse/exports/bundle:
    get:
      description: "Für die Kassen-Nachschau: alle abgeholten TAR-Exporte, die den Zeitraum (Geschäftstage `from`–`to`, 6–6 Uhr) berühren, unverändert in einem ZIP. Header `X-Checksum-SHA256`. 404 TSE_EXPORT_NOT_FOUND, wenn es noch keinen gibt (dann `POST …/tse/exports`)."
      operationId: tse_bundleExports
      parameters:
        - name: id
          required: true
          in: path
          schema:
            type: string
        - name: from
          required: true
          in: query
          description: Erster Geschäftstag (YYYY-MM-DD)
          schema:
            example: 2026-11-03
            type: string
        - name: to
          required: false
          in: query
          description: Letzter Geschäftstag (YYYY-MM-DD), Standard = `from`
          schema:
            type: string
      responses:
        "200":
          description: ""
      security: *a6
      summary: All TSE exports (TAR) of a period as one ZIP (admins)
      tags: *a7
  /api/organizations/{id}/tse/exports/{exportId}/download:
    get:
      description: Liefert das TAR. Header `X-Checksum-SHA256` mit der Prüfsumme.
      operationId: tse_downloadExport
      parameters:
        - name: id
          required: true
          in: path
          schema:
            type: string
        - name: exportId
          required: true
          in: path
          schema:
            type: string
      responses:
        "200":
          description: ""
      security: *a6
      summary: Download a TSE export (admins)
      tags: *a7
  /api/organizations/{id}/tse/transactions:
    get:
      description: Abgesicherte Vorgänge (neueste zuerst), Filter `status`.
      operationId: tse_transactions
      parameters:
        - name: id
          required: true
          in: path
          schema:
            type: string
        - name: status
          required: false
          in: query
          schema:
            type: string
            enum:
              - pending
              - signed
              - training
              - failed
        - name: limit
          required: false
          in: query
          schema:
            maximum: 200
            default: 50
            type: number
        - name: offset
          required: false
          in: query
          schema:
            default: 0
            type: number
      responses:
        "200":
          description: ""
      security: *a6
      summary: Signed and failed TSE transactions (admins)
      tags: *a7
  /api/organizations/{id}/tse/outages:
    get:
      description: "Ausfallprotokoll (AEAO zu § 146a Nr. 1.14): Beginn, Ende, Grund, Anzahl."
      operationId: tse_outages
      parameters:
        - name: id
          required: true
          in: path
          schema:
            type: string
      responses:
        "200":
          description: ""
      security: *a6
      summary: TSE outage log (admins)
      tags: *a7
  /api/organizations/{id}/tse/orders/{orderId}:
    get:
      description: Alle TSE-Vorgänge einer Bestellung (Bestellung, Kassenbelege, Gegenbelege) mit QR-Code-Inhalt — für Nachdruck und digitalen Beleg.
      operationId: tse_forOrder
      parameters:
        - name: id
          required: true
          in: path
          schema:
            type: string
        - name: orderId
          required: true
          in: path
          schema:
            type: string
      responses:
        "200":
          description: ""
      security: *a6
      summary: TSE data of an order (admins)
      tags: *a7
  /api/admin/tse/units:

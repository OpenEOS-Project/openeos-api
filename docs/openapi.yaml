          required: false
          in: query
          schema: {}
        - name: status
          required: false
          in: query
          schema: {}
        - name: limit
          required: false
          in: query
          schema: {}
        - name: cursor
          required: false
          in: query
          schema: {}
        - name: to
          required: false
          in: query
          schema: {}
        - name: from
          required: false
          in: query
          schema: {}
        - name: scope
          required: false
          in: query
          schema:
            enum:
              - device
              - all
            type: string
        - name: paymentMethod
          required: false
          in: query
          schema: {}
        - name: displayStatus
          required: false
          in: query
          schema: {}
        - name: q
          required: false
          in: query
          schema: {}
        - name: eventId
          required: false

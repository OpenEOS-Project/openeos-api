              SERVICE=$(config_json | jq -r --arg img "$IMAGE_PREFIX" \
                '.services | to_entries[] | select((.value.image // "") | startswith($img)) | select(.key != "migrate") | .key' | head -n1)
            fi
            if [ -z "$SERVICE" ]; then
              echo "::error::Kein Compose-Dienst mit Image $IMAGE_PREFIX gefunden." >&2
              exit 1
            fi
            IMAGE_REF=$(config_json | jq -r --arg s "$SERVICE" '.services[$s].image')

            # Nur ein Deploy je Compose-Projekt gleichzeitig — auch gegen manuelle
            # Rollouts (openeos-rollout auf dem Server nimmt dieselbe Sperre).
            # Zwei ueberlappende docker rollout raeumen sich gegenseitig Container weg.
            LOCK_DIR=/var/lib/openeos-deploy/locks

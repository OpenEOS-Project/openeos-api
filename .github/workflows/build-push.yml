name: Build and Push Docker Image

on:
  push:
    branches:
      - main
      - dev
    tags:
      - 'v*'
  # Auch Pull Requests gegen dev pruefen. Veroeffentlicht wird dabei nichts:
  # der Push ins Registry haengt an `github.event_name != 'pull_request'`,
  # und die Deploy-Jobs verlangen ohnehin ein `push`-Ereignis. Ein PR baut
  # das Abbild also nur, um zu zeigen, dass es baut.
  pull_request:
    branches:
      - main
      - dev
  workflow_dispatch:
    inputs:
      force:
        description: 'Produktion: Deploy-Schutz übergehen (auch während eines Festes ausrollen)'
        required: false
        default: false
        type: boolean

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository }}

jobs:
  test:
    name: Test
    runs-on: ubuntu-latest
    # Datenbank und Redis nur fuer `pnpm docs:check`: AppModule verbindet
    # beim Start, und die eingecheckte OpenAPI-Beschreibung (docs/) muss
    # zum Code passen — die Doku-Seite rendert sie.
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: openeos
          POSTGRES_PASSWORD: openeos_dev_password
          POSTGRES_DB: openeos
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U openeos"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
      redis:
        image: redis:7-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 9

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'pnpm'

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Test
        run: pnpm test

      - name: Lint
        run: pnpm lint

      - name: OpenAPI spec in sync (docs/openapi.json|yaml)
        env:
          NODE_ENV: test
          JWT_SECRET: ci-docs-check
          DATABASE_LOGGING: 'false'
        run: pnpm docs:check

      # Der `eslint --fix`-Lauf, den der frühere Kommentar hier gefordert
      # hat, ist erfolgt: rund 2250 Befunde bereinigt. Was blieb, ist
      # Typschuld (`no-unsafe-*`) und steht als Warnung in eslint.config.mjs
      # — dort steht auch, warum.

  # SBOM (CycloneDX) aus dem Lockfile, als Build-Artefakt am Workflow-Lauf.
  # Vorbereitung auf den Cyber Resilience Act (Anhang I Teil II, ab 12/2027).
  sbom:
    name: SBOM
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Generate CycloneDX SBOM
        uses: anchore/sbom-action@v0
        with:
          path: .
          format: cyclonedx-json
          output-file: sbom.cdx.json
          artifact-name: ${{ github.event.repository.name }}-sbom.cdx.json
          upload-release-assets: false

  build-and-push:
    needs: test
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to Container Registry
        if: github.event_name != 'pull_request'
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract metadata (tags, labels)
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
          tags: |
            # Set latest tag for default branch
            type=raw,value=latest,enable={{is_default_branch}}
            # Tag with branch name
            type=ref,event=branch
            # Tag with PR number
            type=ref,event=pr
            # Tag with git tag (v1.0.0 -> 1.0.0)
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=semver,pattern={{major}}
            # Tag with short SHA
            type=sha,prefix=
            # Auto-incrementing build version (one per workflow run)
            type=raw,value=1.0.${{ github.run_number }},enable={{is_default_branch}}

      - name: Build and push Docker image
        uses: docker/build-push-action@v6
        with:
          context: .
          push: ${{ github.event_name != 'pull_request' }}
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
          platforms: ${{ github.event_name == 'pull_request' && 'linux/amd64' || 'linux/amd64,linux/arm64' }}
          build-args: |
            APP_VERSION=1.0.${{ github.run_number }}

  deploy:
    name: Deploy to production
    runs-on: ubuntu-latest
    needs: build-and-push
    # Auch per "Run workflow" auf main — mit force=true ohne Deploy-Schutz.
    if: (github.event_name == 'push' || github.event_name == 'workflow_dispatch') && github.ref == 'refs/heads/main' && vars.DEPLOY_ENABLED == 'true'
    # Der Deploy-Schutz wartet bis zu 90 Minuten.
    timeout-minutes: 120
    concurrency:
      group: deploy-production-${{ github.repository }}
      cancel-in-progress: false
    steps:
      # Kein Ausrollen, solange eine Veranstaltung verkauft (echte Bestellungen
      # in den letzten 30 min): alle 5 min neu fragen, nach 90 min abbrechen.
      - name: Deploy guard
        uses: OpenEOS-Project/.github/actions/deploy-guard@main
        with:
          token: ${{ secrets.DEPLOY_GUARD_TOKEN }}
          url: ${{ vars.DEPLOY_GUARD_URL }}
          force: ${{ inputs.force && 'true' || 'false' }}

      - name: Determine SSH port
        id: ssh-port
        run: echo "port=${DEPLOY_PORT:-22}" >> "$GITHUB_OUTPUT"
        env:
          DEPLOY_PORT: ${{ secrets.DEPLOY_PORT }}

      # pull -> Migration (eigener Schritt) -> docker rollout, siehe README
      # ("Automatisches Deployment").
      - name: Update production via SSH
        uses: appleboy/ssh-action@v1
        with:
          host: ${{ secrets.DEPLOY_HOST }}
          username: ${{ secrets.DEPLOY_USER }}
          key: ${{ secrets.DEPLOY_SSH_KEY }}
          port: ${{ steps.ssh-port.outputs.port }}
          command_timeout: 20m
          script: |
            cd ${{ vars.DEPLOY_PATH || format('/srv/docker/{0}', github.event.repository.name) }}
            set -eu
            SERVICE="${{ vars.DEPLOY_SERVICE }}"
            IMAGE_PREFIX="ghcr.io/openeos-project/${{ github.event.repository.name }}"
            config_json() { docker compose config --format json; }

            # Ohne DEPLOY_SERVICE: der Dienst, der das Image dieses Repos nutzt.
            if [ -z "$SERVICE" ]; then
              SERVICE=$(config_json | jq -r --arg img "$IMAGE_PREFIX" \
                '.services | to_entries[] | select((.value.image // "") | startswith($img)) | select(.key != "migrate") | .key' | head -n1)
            fi
            if [ -z "$SERVICE" ]; then
              echo "::error::Kein Compose-Dienst mit Image $IMAGE_PREFIX gefunden." >&2
              exit 1
            fi
            IMAGE_REF=$(config_json | jq -r --arg s "$SERVICE" '.services[$s].image')

            # Nur ein Deploy je Compose-Projekt gleichzeitig — auch gegen manuelle
            # Rollouts (openeos-rollout auf dem Server nimmt dieselbe Sperre).
            # Zwei ueberlappende docker rollout raeumen sich gegenseitig Container weg.
            LOCK_DIR=/var/lib/openeos-deploy/locks
            [ -d "$LOCK_DIR" ] && [ -w "$LOCK_DIR" ] || LOCK_DIR=/tmp
            umask 002
            exec 9>>"$LOCK_DIR/$(config_json | jq -r .name).lock"
            if ! flock -w 900 9; then
              echo "::error::Ein anderer Deploy dieses Dienstes laeuft seit 15 Minuten." >&2
              exit 1
            fi

            # Laufendes Image merken: schlaegt der Deploy fehl, bekommt es das
            # Tag zurueck, damit ein spaeterer Neustart nicht den kaputten
            # Stand hochfaehrt.
            PREVIOUS_IMAGE=$(docker compose ps -q "$SERVICE" | head -n1 | xargs -r docker inspect --format '{{.Image}}' 2>/dev/null || true)
            restore_previous_tag() {
              if [ -n "$PREVIOUS_IMAGE" ]; then
                echo "Setze $IMAGE_REF zurueck auf $PREVIOUS_IMAGE" >&2
                docker tag "$PREVIOUS_IMAGE" "$IMAGE_REF"
              fi
            }

            docker compose pull "$SERVICE"
            NEW_IMAGE=$(docker image inspect -f '{{.Id}}' "$IMAGE_REF")

            # Migrationen als eigener Schritt vor dem Austausch der Instanzen
            # (nur wo der Server einen Dienst "migrate" hat, also bei der API).
            # Sie muessen mit dem alten Code vertraeglich sein (expand/contract).
            if config_json | jq -e '.services.migrate' >/dev/null; then
              if ! docker compose run --rm --no-deps migrate; then
                echo "::error::Migration fehlgeschlagen — die laufenden Instanzen bleiben unveraendert." >&2
                restore_previous_tag
                exit 1
              fi
            fi

            CONTAINER_NAME=$(config_json | jq -r --arg s "$SERVICE" '.services[$s].container_name // empty')
            if docker rollout --version >/dev/null 2>&1 && [ -z "$CONTAINER_NAME" ]; then
              # Ohne Ausfallzeit: neue Instanzen neben den alten starten, auf
              # "healthy" warten, die alten per /tmp/drain aus Traefik nehmen
              # (Health-Check schlaegt fehl), dann stoppen. Werden die neuen
              # nicht gesund, entfernt docker rollout sie wieder.
              if ! docker rollout --timeout 180 --pre-stop-hook 'touch /tmp/drain && sleep 15' "$SERVICE"; then
                # Laeuft der neue Stand schon gesund, ist nur das Aufraeumen der
                # alten Instanzen gescheitert — dann das Tag nicht zuruecksetzen.
                if docker compose ps -q "$SERVICE" | xargs -r docker inspect -f '{{.Image}} {{if .State.Health}}{{.State.Health.Status}}{{end}}' | grep -q "^$NEW_IMAGE healthy$"; then
                  echo "::error::Rollout unvollstaendig: der neue Stand laeuft, alte Instanzen bitte pruefen (docker compose ps -a)." >&2
                else
                  echo "::error::Neue Instanzen wurden nicht gesund — die alten laufen weiter." >&2
                  restore_previous_tag
                fi
                exit 1
              fi
            else
              # Server noch ohne docker rollout bzw. mit festem container_name:
              # Austausch wie bisher, mit kurzer Unterbrechung.
              echo "::warning::docker rollout nicht verfuegbar oder container_name gesetzt — compose up -d."
              docker compose up -d "$SERVICE"
              healthy=false
              for _ in $(seq 1 40); do
                sleep 3
                states=$(docker compose ps -q "$SERVICE" | xargs -r docker inspect --format '{{if .State.Health}}{{.State.Health.Status}}{{else}}{{.State.Status}}{{end}}')
                if [ -n "$states" ] && ! echo "$states" | grep -qvE '^(healthy|running)$'; then
                  healthy=true
                  break
                fi
              done
              if [ "$healthy" != "true" ]; then
                echo "::error::Neuer Stand nach 120 s nicht gesund." >&2
                restore_previous_tag
                docker compose up -d "$SERVICE"
                exit 1
              fi
            fi

            docker image prune -f

  deploy-staging:
    name: Deploy to staging
    runs-on: ubuntu-latest
    needs: build-and-push
    if: github.event_name == 'push' && github.ref == 'refs/heads/dev' && vars.DEPLOY_ENABLED == 'true'
    concurrency:
      group: deploy-staging-${{ github.repository }}
      cancel-in-progress: false
    steps:
      - name: Determine SSH port
        id: ssh-port
        run: echo "port=${DEPLOY_PORT:-22}" >> "$GITHUB_OUTPUT"
        env:
          DEPLOY_PORT: ${{ secrets.DEPLOY_PORT }}

      - name: Update staging via SSH
        uses: appleboy/ssh-action@v1
        with:
          host: ${{ secrets.DEPLOY_HOST }}
          username: ${{ secrets.DEPLOY_USER }}
          key: ${{ secrets.DEPLOY_SSH_KEY }}
          port: ${{ steps.ssh-port.outputs.port }}
          command_timeout: 20m
          script: |
            cd ${{ vars.STAGING_DEPLOY_PATH || format('/srv/docker/staging/{0}', github.event.repository.name) }}
            set -eu
            SERVICE="${{ vars.DEPLOY_SERVICE }}"
            IMAGE_PREFIX="ghcr.io/openeos-project/${{ github.event.repository.name }}"
            config_json() { docker compose config --format json; }

            # Ohne DEPLOY_SERVICE: der Dienst, der das Image dieses Repos nutzt.

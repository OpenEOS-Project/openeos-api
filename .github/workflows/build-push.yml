            # Tag zurueck, damit ein spaeterer Neustart nicht den kaputten
            # Stand hochfaehrt.
            PREVIOUS_IMAGE=$(docker compose ps -q "$SERVICE" | head -n1 | xargs -r docker inspect --format '{{.Image}}' 2>/dev/null || true)
